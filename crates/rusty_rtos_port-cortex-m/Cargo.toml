[package]
name = "rusty_rtos_port-cortex-m"
description = "The Kairos Cortex-M port: critical sections, the yield, the tick, stack initialisation and the PendSV context switch. One of the two crates in the family allowed a fenced `unsafe` block."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_rtos_port-cortex-m"
keywords = ["rtos", "cortex-m", "freertos", "embedded", "remade-with-rust"]
categories = ["embedded", "no-std"]

[dependencies]
rusty_rtos_core = { version = "0.2.0", default-features = false }

[features]
default = []
alloc = ["rusty_rtos_core/alloc"]

[lints]
workspace = true
