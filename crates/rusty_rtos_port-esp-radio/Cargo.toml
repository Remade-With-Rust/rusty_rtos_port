[package]
name = "rusty_rtos_port-esp-radio"
description = "esp-radio on a Kairos kernel: the five esp-radio-rtos-driver implementations, as a crate rather than glue inside one firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["rtos", "embedded", "esp32", "no-std", "freertos"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
# The vocabulary: handles, and nothing that fixes a kernel geometry. This
# crate deliberately does NOT depend on rusty_rtos_kernel-core — the whole
# point of the RadioHost seam is that the kernel's const generics stay on the
# consumer's side of it.
rusty_rtos_core = { version = "0.2.0", default-features = false }

# The saved context is architecture-shaped; exactly one of these is on.
rusty_rtos_port-xtensa = { version = "0.2.0", default-features = false, optional = true }
rusty_rtos_port-riscv = { version = "0.2.0", default-features = false, optional = true }

# The interface being implemented. An exact pin: it is a trait set that a C
# driver dispatches through, so a minor bump can change the shape without
# changing the name.
esp-radio-rtos-driver = { version = "=0.4.2", default-features = false }

[features]
default = []
# Exactly one architecture. Janus needs `riscv` for the C6; the cell this
# was extracted from is `xtensa`.
xtensa = ["dep:rusty_rtos_port-xtensa"]
riscv = ["dep:rusty_rtos_port-riscv"]
# `ipc-implementations` is what exposes `wait_queue` and the two task-priority
# methods; without it the driver asks for a smaller trait set.
ipc-implementations = ["esp-radio-rtos-driver/ipc-implementations"]
esp32s3 = ["esp-radio-rtos-driver/esp32s3"]
esp32c6 = ["esp-radio-rtos-driver/esp32c6"]
