[package]
name = "mps2-an385-qemu-preempt"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rusty_rtos_port-cortex-m = { path = "../../crates/rusty_rtos_port-cortex-m" }
# The scheduler itself. Siblings by git URL, as firmware/README.md says.
# By PATH, not by git, and deliberately against `firmware/README.md`'s
# "siblings by git URL as usual".
#
# This cell exists to gate KERNEL changes. A git dependency resolves to
# the published kernel, so the cell would build green against code that
# is not the code under test -- which is what the sibling
# `mps2-an385-qemu-kernel` cell does today, and why it has never
# exercised a local kernel edit. `kairos patches` cannot help: it scans
# only `crates/*`, and a patch row the package workspace does not use
# becomes the `[[patch.unused]]` lockfile hazard its own header warns
# about.
#
# The cost is that this cell cannot be built from a standalone clone of
# `rusty_rtos_port`. That is a real trade and it is the owner's to
# revisit; a gate that cannot see the change it gates is worth less.
rusty_rtos_kernel-core = { path = "../../../rusty_rtos_kernel/crates/rusty_rtos_kernel-core", default-features = false }
# By PATH for the same reason, and it has to be: `kairos patches` writes
# only `[patch.crates-io]`, so a git dependency here can never be
# redirected to the local checkout -- while the kernel above, being a path
# dependency, resolves ITS `rusty_rtos_core` through that patch. Two
# sources for one crate is two crates, and the cell stops building the
# moment core and kernel have to agree about anything.
rusty_rtos_core = { path = "../../../rusty_rtos_core/crates/rusty_rtos_core", default-features = false }

cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[workspace]
